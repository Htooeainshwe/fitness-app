<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fitness App</title>

    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <h1>My Bulking Planner</h1>

    <form>
      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight">

      <label for="height">Height (cm)</label>
      <input type="number" id="height" name="height">

      <label for="age">Age</label>
      <input type="number" id="age" name="age">

      <label for="sex">Sex</label>
      <select id="sex" name="sex">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
        <option value="prefer_not_to_say">Prefer not to say</option>
      </select>

      <!-- TODO: gym days per week (you write this one) -->
      <label for="gym_days">Gym days per week</label>
      <input type="number" id="gym_days" name="gym_days" min="1" max="7">  


      <label for="goal">Goal</label>
      <select id="goal" name="goal">
        <option value="gain_weight">Gain weight</option>
        <option value="build_muscle">Build muscle</option>
      </select>

      <button type="submit">Create my plan</button>
    
    </form>
    
  </body>
</html>
